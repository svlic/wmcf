[project]
name = "wavemonitor-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for the stock data monitor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "hyperliquid-python-sdk>=0.9.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "vulture>=2.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.vulture]
paths = ["backend/src", "backend/vulture_whitelist.py"]
min_confidence = 80
exclude = ["*/.venv/*"]
