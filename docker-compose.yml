services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/wavemonitor.sqlite3
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WAVEMONITOR_WEB_PASSWORD: ${WAVEMONITOR_WEB_PASSWORD:-}
      WAVEMONITOR_SESSION_SECRET: ${WAVEMONITOR_SESSION_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - wavemonitor-sqlite:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "54002:8080"

volumes:
  wavemonitor-sqlite:
